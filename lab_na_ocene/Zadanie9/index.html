<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Zadanie 9</title>
</head>
<body>

    <div class="card">
        <img src="assets/t-shirt-blue.png" alt="blue">
        <div class="info">
            <div class="details">
                <h3 id="name">Adidas Originals</h3>
                <p id="price">$29.99</p>
                <p id="type">Men's running tshirt</p>
            </div>
            <div class="sizes">
                <p id="size">SIZE</p>
                <div class="buttons">
                    <label class="size-option">
                        <input type="radio" name="size">
                        <span>XS</span>
                    </label>
                    <label class="size-option">
                        <input type="radio" name="size">
                        <span>S</span>
                    </label>
                    <label class="size-option">
                        <input type="radio" name="size" checked>
                        <span>M</span>
                    </label>
                    <label class="size-option">
                        <input type="radio" name="size">
                        <span>L</span>
                    </label>
                    <label class="size-option">
                        <input type="radio" name="size">
                        <span>XL</span>
                    </label>
                </div>
            </div>
            <div class="sizes">
                <p id="size">COLOUR</p>
                <div class="buttons" id="colours">
                    <label class="color-option">
                        <input type="radio" name="color" id="white">
                        <span style="background-color: rgb(185, 185, 185);"></span>
                    </label>
                    <label class="color-option">
                        <input type="radio" name="color" id="blue" checked>
                        <span style="background-color: rgb(55, 115, 220);"></span>
                    </label>
                    <label class="color-option">
                        <input type="radio" name="color" id="orange">
                        <span style="background-color: rgb(255, 190, 39);"></span>
                    </label>
                </div>
            </div>
            <div class="actions">
                <button class="action">BUY NOW</button>
                <button class="action">ADD TO CART</button>
            </div>
        </div>
    </div>

</body>
</html>
