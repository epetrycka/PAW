<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="gallery-container">
        <div class="main-display">
            <div class="slide active" data-name="Ania Nowak" data-role="Designer || Developer">
                <img src="images/img1.jpg" alt="Ania Nowak">
            </div>
            <div class="slide" data-name="Maciej Kowalski" data-role="Frontend Developer">
                <img src="images/img2.jpg" alt="Maciej Kowalski">
            </div>
            <div class="slide" data-name="Justyna Barańska" data-role="UX Designer">
                <img src="images/img3.jpg" alt="Justyna Barańska">
            </div>
            <div class="slide" data-name="Piotr Zieliński" data-role="Backend Developer">
                <img src="images/img4.jpg" alt="Piotr Zieliński">
            </div>
            <div class="slide" data-name="Anna Zalewska" data-role="Project Manager">
                <img src="images/img5.jpg" alt="Anna Zalewska">
            </div>
            <div class="slide" data-name="Krzysztof Wojcik" data-role="Data Scientist">
                <img src="images/img6.jpg" alt="Krzysztof Wojcik">
            </div>
            <div class="person-info" style="display: none;">
                <h3 id="info-name"></h3>
                <p id="info-role"></p>
            </div>
        </div>

        <div class="avatars-tray">
            <div class="avatar active" data-index="0">
                <img src="images/img1.jpg" alt="Ania Nowak">
            </div>
            <div class="avatar" data-index="1">
                <img src="images/img2.jpg" alt="Maciej Kowalski">
            </div>
            <div class="avatar" data-index="2">
                <img src="images/img3.jpg" alt="Justyna Barańska">
            </div>
            <div class="avatar" data-index="3">
                <img src="images/img4.jpg" alt="Piotr Zieliński">
            </div>
            <div class="avatar" data-index="4">
                <img src="images/img5.jpg" alt="Anna Zalewska">
            </div>
            <div class="avatar" data-index="5">
                <img src="images/img6.jpg" alt="Krzysztof Wojcik">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
