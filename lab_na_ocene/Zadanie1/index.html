<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="skeleton-card">
        <div class="skeleton-header">
            <div class="skeleton-avatar skeleton-item"></div>
            <div class="skeleton-text-lines">
                <div class="skeleton-line skeleton-item short"></div>
                <div class="skeleton-line skeleton-item medium"></div>
            </div>
        </div>
        <div class="skeleton-text-lines" style="margin-top: 1.5em">
            <div class="skeleton-line skeleton-item medium"></div>
            <div class="skeleton-line skeleton-item long"></div>
            <div class="skeleton-line skeleton-item short"></div>
        </div>

        <div class="skeleton-buttons">
            <div class="skeleton-button skeleton-item"></div>
            <div class="skeleton-button skeleton-item"></div>
        </div>
    </div>

</body>
</html>
