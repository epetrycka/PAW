<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <div class="shopping-app" id="app-container">
        
        <header class="app-header">
            <h1>Shopping List App</h1>
            <div class="header-buttons">
                <button id="add-item-btn" class="btn">Add Item</button>
                <button id="cancel-btn" class="btn btn-danger hidden">Cancel</button>
            </div>
        </header>

        <div class="edit-container hidden" id="edit-container">
            <form id="item-form">
                <input type="text" id="item-input" placeholder="Add an Item" autocomplete="off">
                <div class="form-controls">
                    <label class="priority-label">
                        <input type="checkbox" id="priority-check">
                        High Priority
                    </label>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </div>
            </form>
        </div>

        <div class="item-list-container">
            <ul id="item-list">
                <li class="high-priority">Masło</li>
                <li>YYYYY</li>
                <li class="completed">20 cups</li>
                <li class="completed">2 board games</li>
                <li>10 party hats</li>
            </ul>
        </div>
    </div>
</body>
</html>
