<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsplash API Tester</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-camera"></i>
            Demo by GR - Unsplash API Tester
        </div>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search...">
            <button type="submit" class="search-btn">
                <i class="fa-solid fa-search"></i>
            </button>
        </form>
    </header>

    <div class="main" id="main-content">
        <h3 id="search-prompt">Wyszukaj hasło w polu wyszukiwania</h3>
        
        <div class="slider-container" id="slider-container">
            <button id="scroll-left" class="slider-btn">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <div class="slider-window">
                <div id="slider-strip">
                </div>
            </div>
            
            <button id="scroll-right" class="slider-btn">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <div id="lightbox-overlay">
        <span id="close-lightbox">&times;</span>
        <img id="lightbox-image" src="" alt="Powiększone zdjęcie">
    </div>

</body>
</html>
